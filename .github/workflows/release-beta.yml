permissions: write-all
name: Release Obsidian plugin (beta)

on: workflow_dispatch

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_VERSION: ${{ steps.version.outputs.PACKAGE_VERSION }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      - id: version
        name: Get version
        run: echo "PACKAGE_VERSION=$(node -p "require('./manifest-beta.json').version")" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    needs: [get-version]
    env:
      PACKAGE_VERSION: ${{ needs.get-version.outputs.PACKAGE_VERSION }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run compile:i18n
          npm run check:types
          npm test

      - name: Build plugin
        run: |
          npm run build

      # BRAT installs the manifest.json attached to the release, not the one in
      # the repository, and warns the user when its version disagrees with the
      # release tag. The tag comes from manifest-beta.json, so that is the
      # manifest the release has to carry.
      - name: Stage beta manifest
        run: |
          mkdir -p release-assets
          cp manifest-beta.json release-assets/manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/main.js
            release-assets/manifest.json
            build/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ env.PACKAGE_VERSION }}

          gh release create "$version" \
            --title="$version" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --draft \
            build/main.js release-assets/manifest.json build/styles.css
