name: Bench

# Rot detection, not a performance gate: there is no baseline and no budget, so this
# fails when the bench stops running, not when a number moves.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci

      - run: npm run bench
