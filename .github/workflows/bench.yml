name: Bench

# Rot detection, not a performance gate: there is no baseline and no budget, so this
# fails when the bench stops running, not when a number moves.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: npm

      - run: npm ci

      - run: npm run bench
