name: Checks

# `pull_request` and not a bare `push`: a check run attaches to a SHA, and a fork PR's
# head SHA only ever sees push events in the fork, so a push-only workflow never reports
# here. Required status checks read that as permanently pending, not as skipped, and the
# PR becomes unmergeable with no way to clear it. The `push` half stays pinned to main so
# the merge commit is covered without running every branch push twice.
on:
  pull_request:
  push:
    branches: [main]
    # Tags stay covered because `release.yml` triggers on one and runs only
    # `check:types` and `test`; dropping them here would quietly narrow what a
    # release build is checked against. See docs/releasing.md.
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run compile:i18n
      - run: npm run check:i18n
      - run: npm run check:types
      # `coverage` runs the same suite as `npm test` and adds the floor from vitest.config.mts.
      # Running both would pay for the suite twice to get one signal.
      - run: npm run coverage
      - run: npm run check:lint
      # The published API types are generated from src/api/public-api.ts and committed,
      # so any change to the public surface shows up as a diff in the PR that caused it.
      - run: npm run build:api
      - run: git diff --exit-code packages/api/index.d.ts
      # check:types proves this repo compiles; this proves the package we publish is
      # usable from TypeScript, which is a different thing.
      - run: npm run check:api
