name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly drift-detection across the OS + version matrix (07:00 UTC).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Add the nightly version axis (floor + installer mismatch)"
        type: boolean
        default: true

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        # PR + merge run latest/latest on every OS: the host differences that break this
        # plugin are platform-shaped (native vs DOM menus, path separators, popout focus)
        # and a Linux-only gate cannot see them. Nightly adds the version axis — the floor
        # and the newest-app/oldest-installer mismatch (see docs/e2e-testing-strategy.md),
        # which a manual dispatch can ask for too — a floor-only failure is otherwise
        # unverifiable until the next 07:00 UTC.
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        obsidian: ${{ (github.event_name == 'schedule' || inputs.full_matrix) && fromJSON('["earliest/earliest", "latest/earliest", "latest/latest"]') || fromJSON('["latest/latest"]') }}
        # Only the PR + merge path is sharded, because only there does wall clock buy anything:
        # the suite is dominated by Obsidian process lifecycle rather than by assertions (test
        # bodies are 38% of the Linux run and 25% of the Windows one — 71 sessions plus ~100
        # reloadObsidian boots), so it splits across runners almost linearly. `--shard c/t` slices
        # the spec list *after* suite filtering, contiguously and by file count, not by duration;
        # measured against the run of 2026-09-08 the two halves come out 387s/440s on Windows, the
        # leg that sets the gate. Nightly stays on one shard: it already fans out over the version
        # axis, its wall clock is nobody's feedback loop, and 3 versions x 3 OS x 2 shards would
        # queue against the concurrent-job limit.
        shard: ${{ (github.event_name == 'schedule' || inputs.full_matrix) && fromJSON('["1/1"]') || fromJSON('["1/2", "2/2"]') }}

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      OBSIDIAN_VERSIONS: ${{ matrix.obsidian }}
      # PR + merge run the stable suites; nightly adds the non-blocking `quarantine` lane.
      # Named explicitly rather than falling back to the bare glob: `A && '' || B` yields B
      # in a GitHub expression, because the empty string is falsy — the old form silently
      # gave every run the same list, so quarantine had never run.
      WDIO_SUITES: ${{ (github.event_name == 'schedule' || inputs.full_matrix) && '--suite smoke --suite integration --suite migration --suite interop --suite journeys --suite quarantine' || '--suite smoke --suite integration --suite migration --suite interop --suite journeys' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Obsidian binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ env.OBSIDIAN_VERSIONS }}
          restore-keys: obsidian-cache-${{ runner.os }}-
          # Deliberately not keyed by shard: both shards want the same binaries. On a cold
          # cache they race to save it and the loser logs "another job may be creating this
          # cache" — noise, not failure, and cheaper than storing the same asar twice.

      - name: Build plugin
        run: npm run build

      - name: Run e2e (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx wdio run ./wdio.conf.mts ${{ env.WDIO_SUITES }} --shard ${{ matrix.shard }}

      - name: Run e2e (Windows/macOS)
        if: runner.os != 'Linux'
        run: npx wdio run ./wdio.conf.mts ${{ env.WDIO_SUITES }} --shard ${{ matrix.shard }}

      - name: Publish e2e results
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          report_paths: e2e/.reports/e2e-junit-*.xml
          # The shard belongs in the name: two legs of the same OS and version publish
          # separate checks, and a shared name would leave one silently overwriting the other.
          check_name: e2e results (${{ matrix.os }}, ${{ matrix.obsidian }}, shard ${{ matrix.shard }})
          # Tolerate a suite that crashed before emitting XML; the run step
          # already failed the job in that case.
          require_tests: false
          # Otherwise the results check reports success next to a failed run step.
          fail_on_failure: true

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-reports-${{ matrix.os }}-${{ strategy.job-index }}
          path: e2e/.reports/
          if-no-files-found: ignore
          # e2e/.reports is a dot-directory, and upload-artifact skips hidden paths by
          # default — so every run so far uploaded nothing and CI-only failures had no
          # screenshot and no junit XML to diagnose from.
          include-hidden-files: true

  # The one fixed name for the matrix above, so branch protection can require e2e without
  # naming its legs. `e2e (ubuntu-latest, latest/latest)` and friends are a function of the
  # trigger — schedule and full_matrix expand the `obsidian` axis — so requiring the literal
  # names would pin one trigger's matrix into repo settings, and any name that stops being
  # produced hangs "Expected" forever.
  e2e-gate:
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      # `needs.e2e.result` is 'success' only when every leg succeeded; a cancelled or
      # skipped matrix must not read as a pass.
      - if: ${{ needs.e2e.result != 'success' }}
        run: exit 1
